name: hanium_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # .env는 gitignore 대상이라 clone 후 직접 만들어야 한다. (cp .env.example .env)
  assets:
    - .env

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
          weight: 300
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: CookieRun
      fonts:
        - asset: assets/fonts/CookieRun-Regular.ttf
          weight: 400
        - asset: assets/fonts/CookieRun-Bold.ttf
          weight: 700
        - asset: assets/fonts/CookieRun-Black.ttf
          weight: 900